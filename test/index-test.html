<!DOCTYPE html>
<!---Robert Myers--->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">
    <link href="testCSS.css" rel="stylesheet" />


    <title>index-test</title>
</head>

<body>

    <div>

        <div id="green" class="box"></div>
        <div class="flexContainer">
            <div>
                <table id="cart">
                    <tr>
                        <td>Name</td>
                        <td>Qty.</td>
                        <td>Total</td>
                    </tr>
                    <tr class="template" style="display:none;">
                        <td><span class="item_name">Name</span></td>
                        <td><span class="item_qty">Quantity</span></td>
                        <td><span class="item_total">Total</span>.00</td>
                    </tr>
                </table>
                <label for="name">Name</label>
                <input type="text" class="name" /><br />
                <label for="qty">Quantity</label>
                <input type="number" class="qty" /><br />
                <label for="total">Total</label>
                <input type="number" class="total" /><br />
                <button class="addRow" onclick="addLine()">Add</button>
            </div>
            <div class="characterOptions">
                <form action="">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" /><br />
                    <label for="class">Class</label>
                    <input id="class" name="class" type="text" /><br />
                    <label for="level">Level</label>
                    <input id="level" name="level" type="number" min="1" max="20" /><br />
                    <label form="description">Description</label>
                    <textarea id="description" name="description" rows="5" cols="50"></textarea>
                    <input type="submit" value="Submit" />
                </form>
            </div>
            <div>
                <input type="radio" name="address" value="Home" />home address
                <input type="radio" name="delivery" value="FedEx" />federal express
                <input type="radio" name="delivery" value="UPS" />UPS
                <div class="itemContainer connected">
                    <table class="itemList connected">
                    </table>
                </div>
                <div class="selection">
                    <div id="weaponSelection">
                        <table class="weaponTable connected">
                            <div class="">
                            <tr>
                                <td>Dagger</td>
                                <td>2gp</td>
                            </tr>
                            <tr>
                                <td>Longsword</td>
                                <td>15gp</td>
                            </tr>
                            <tr>
                                <td>Katana</td>
                                <td>50gp</td>
                            </tr>
                            <tr>
                                <td>Wakizashi</td>
                                <td>35gp</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="flexContainer">
            <div>
                <ul id="loadBox">
                    <li>
                        <a href="load1.html">Equipment</a>
                    </li>
                    <li>
                        <a href="load2.html">Gene Altered Humans</a>
                    </li>
                </ul>
                <div id="loadData">
                    data
                </div>
            </div>
            <div>
                <label for="#itemList">Item Selection</label>
                <input type="text" id="itemList" />
                <input type="submit" value="Add!" />
            </div>
            <div>
                <div id="range">
                    <form action="">
                        <fieldset>
                            <label for="min">Minimum</label>
                            <select id="min" name="min">
                                <option value="0">0</option>
                                <option value="10">10</option>
                                <option value="20">20</option>
                                <option value="30">30</option>
                                <option value="40">40</option>
                                <option value="50">50</option>
                                <option value="60">60</option>
                                <option value="70">70</option>
                                <option value="80">80</option>
                                <option value="90">90</option>
                                <option value="100">100</option>

                            </select>
                            <br />
                            <label for="max">Maximum</label>
                            <select id="max" name="max">
                                <option value="0">0</option>
                                <option value="10">10</option>
                                <option value="20">20</option>
                                <option value="30">30</option>
                                <option value="40">40</option>
                                <option value="50">50</option>
                                <option value="60">60</option>
                                <option value="70">70</option>
                                <option value="80">80</option>
                                <option value="90">90</option>
                                <option value="100">100</option>
                            </select>

                        </fieldset>
                    </form>
                </div>
                <table class="data">
                    <!--weapon price-->
                    <tr>
                        <th>name</th>
                        <th>price</th>
                    </tr>
                    <tr>
                        <td>longswor</td>
                        <td>15</td>
                    </tr>
                    <tr>
                        <td>dagger</td>
                        <td>2</td>
                    </tr>
                    <tr>
                        <td>katana</td>
                        <td>50</td>
                    </tr>
                    <tr>
                        <td>wakizashi</td>
                        <td>35</td>
                    </tr>
                </table>
            </div>
        </div>
        <!--drag and drop-->
        <div class="area">
            
        </div>
        <div id="imageGrid">
            <img src="penGun.jpg" />
            <img src="palm_protector_pistol.jpg" />
            <img src="six_shot_ring_gun_in_case1.jpg" />
        </div>

        <!--responsiv slide-->
        <ul class="rslides">
            <li><img src="penGun.jpg" /></li>
            <li><img src="palm_protector_pisol.jpg" /></li>
            <li><img src="revolverSword.jpg" /></li>
        </ul>

        <script src="jquery-3.7.1.min.js"></script>
        <script src="jquery-ui.min.js"></script>
        <script src="jquery-hoverIntent-master/jquery.hoverIntent.min.js"></script>
        <script src="testScript.js"></script>
        <script src="jquery-ui-1.8.17.custom.min.js"></script>
        <script src="responsiveslides.min.js"></script>
        <!--<script src="menuScript.js"></script>-->
        <!--<script src="tooltipJS.js"></script>-->

</body>

</html>
