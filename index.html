<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">
    <link href="CSS/menuCSS.css" rel="stylesheet" />
    <link href="CSS/indexCSS.css" rel="stylesheet">
    <!--<link href="CSS/toolTipCSS.css" rel="stylesheet" />-->
    <title>index</title>
</head>

<body>
    <div id="green" class="box"></div>
    <form>
        <input type="text" name="search" placeholder="Search" />
        <button>Search</button>
    </form>
    <header id="head">
        <h1 id="title">
            A selection of characters, items and monsters for D&amp;D,
            Pathfinder, and d20Modern
        </h1>
    </header>

    <div class="flexContainer">
        <div class="tempBar"></div>
        <div class="sideBar">
            <div class="sideBarButtonOutside hidden">
                <span id="sideBarButton" class="sideBarButtonRight"></span>
            </div>
            
        <div class="logos">
            <div id="pathLogoBox">
                <a href="https://www.d20pfsrd.com/" class="pathLink">
                    <img src="images/PathfinderLogo.png" id="pathLogo"
                         title="An update to D&D version 3.5
                            Link to www.d20pfsrd.com" />
                </a>
            </div>
            <div>
            <img src="images/d20Modern.jpg" id="modernLogo"
                 title="D&D version 3.0 for the modern day" />
                </div>
            <div>
            <img src="images/5eImage-modified.png" id="fithELogo"
                 title="current edition of D&D" />
                </div>
        </div>
        
    </div>
    <script src="jquery-3.7.1.min.js"></script>
    <!--<script src="jquery-ui-1.14.1/jquery-ui.min"></script>-->
    <!--needed for 'shake'-->
    <script src="jquery/jquery-ui.min.js"></script>
    <script src="jquery-hoverIntent-master/jquery.hoverIntent.min.js"></script>
    <script src="javaScript/indexScript.js"></script>
    <script src="javaScript/menuScript.js"></script>
    <!--<script type="module" src="menu.json"></script>-->
    <script src="menu.json"></script>
</body>

</html>
